server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS server (re-resolves 'java-api' every 5s when scaling dynamically)
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Reverse proxy & load balancer for Java Backend API instances (Internal port 8080)
  location /api/ {
    # Using a variable forces Nginx to re-resolve DNS dynamically across all scaled replicas
    set $backend_upstream "http://java-api:8080";
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Diagnostic header showing which backend container IP handled the request
    add_header X-Served-By $upstream_addr always;
  }

  # SPA routing - redirect all requests to index.html if file doesn't exist
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "public, max-age=3600";
  }

  # Cache static assets with long expiration
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Disable caching for index.html
  location = /index.html {
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css text/javascript application/json application/javascript;
  gzip_min_length 1000;
}
