spring.application.name=ecomm-test

server.servlet.context-path=/api

# Use H2 In-Memory Database with MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:ecomm_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate configurations for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true

# Dummy Razorpay keys
razorpay.key_id=rzp_test_dummyKey123
razorpay.key_secret=dummySecretKey456

# Dummy Mail Configuration
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=dummy
spring.mail.password=dummy
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# JWT Configuration (Test specific secrets and short expirations)
jwt.secret=5f4dcc3b5aa765d61d8327deb882cf995f4dcc3b5aa765d61d8327deb882cf99
jwt.access.expiration=900000
jwt.refresh.expiration=604800000

logging.level.org.springframework.security=DEBUG
