services:
  # 1. MySQL Database
  mysql-db:
    image: mysql:8.0
    container_name: ecomm-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecomm}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # Wait until MySQL is actually ready to accept connections
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Java Spring Boot API
  java-api:
    build:
      context: ./backend/java-api
    container_name: ecomm-java-api
    restart: always
    ports:
      - "${JAVA_API_HOST_PORT:-8081}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE:-ecomm}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_ROOT_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    depends_on:
      mysql-db:
        condition: service_healthy

  # 3. React Frontend
  frontend:
    build:
      context: ./frontend
    container_name: ecomm-frontend
    restart: always
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      - java-api

# Define the persistent storage volume for MySQL
volumes:
  mysql_data:
